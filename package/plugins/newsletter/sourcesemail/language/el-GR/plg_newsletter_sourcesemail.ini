PLG_NEWSLETTER_SOURCESEMAIL_EMAIL_PRIVATE_DESC="Επιτρέπει σε συμβατούς hosts να ζητούν Πηγές για επαληθευμένο, ενεργό Joomla userId. Αρχικά ανενεργό. Μη επιτρεπτά ιδιωτικά αιτήματα αποδίδονται δημόσια με προειδοποίηση. Ο host ευθύνεται για την ταυτοποίηση του παραλήπτη και την ασφαλή παράδοση ιδιωτικού περιεχομένου."
PLG_NEWSLETTER_SOURCESEMAIL_DESCRIPTION="Απόδοση πηγών σε email για συμβατά συστήματα, με δημόσιο περιεχόμενο και προαιρετική ιδιωτική απόδοση ανά παραλήπτη. Ενεργοποιήστε με δημόσια πρόσβαση."
